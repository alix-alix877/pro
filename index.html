<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>البورتفوليو</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1B1B1F;
    --bg-raised:#242429;
    --ink:#F2F0EA;
    --ink-dim:#A9A79F;
    --accent:#C98A4B;
    --line:#38373D;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'IBM Plex Sans Arabic', sans-serif;
    line-height:1.7;
  }
  .wrap{
    max-width:760px;
    margin:0 auto;
    padding:80px 24px 120px;
  }
  header{
    display:flex;
    flex-direction:column;
    gap:18px;
    margin-bottom:80px;
  }
  .avatar{
    width:76px;height:76px;border-radius:50%;
    object-fit:cover;
    border:1px solid var(--line);
  }
  h1{
    font-family:'Fraunces', serif;
    font-size:clamp(2.2rem,5vw,3.2rem);
    font-weight:600;
    margin:0;
    letter-spacing:-0.01em;
  }
  .role{
    color:var(--accent);
    font-size:1.05rem;
    margin-top:4px;
  }
  .bio{
    color:var(--ink-dim);
    font-size:1.05rem;
    max-width:56ch;
  }
  .links{
    display:flex;
    gap:20px;
    margin-top:8px;
  }
  .links a{
    color:var(--ink);
    text-decoration:none;
    border-bottom:1px solid var(--line);
    padding-bottom:2px;
    font-size:.95rem;
    transition:border-color .2s, color .2s;
  }
  .links a:hover{border-color:var(--accent);color:var(--accent);}

  .section-label{
    font-family:'Fraunces', serif;
    font-size:1.4rem;
    font-weight:600;
    margin-bottom:8px;
  }
  .count{
    color:var(--ink-dim);
    font-size:.9rem;
    margin-bottom:36px;
  }

  .project{
    border-top:1px solid var(--line);
    padding:32px 0;
    display:grid;
    grid-template-columns:1fr;
    gap:14px;
  }
  .project:last-child{border-bottom:1px solid var(--line);}
  .project-title{
    font-family:'Fraunces', serif;
    font-size:1.4rem;
    font-weight:600;
    margin:0;
  }
  .project-title a{
    color:var(--ink);
    text-decoration:none;
  }
  .project-title a:hover{color:var(--accent);}
  .project-desc{
    color:var(--ink-dim);
    font-size:.98rem;
    max-width:60ch;
  }
  .project-meta{
    display:flex;
    gap:14px;
    align-items:center;
  }
  .project-link{
    font-size:.85rem;
    color:var(--accent);
    text-decoration:none;
    border-bottom:1px solid transparent;
  }
  .project-link:hover{border-color:var(--accent);}
  .project-img{
    width:100%;
    max-height:340px;
    object-fit:cover;
    border-radius:4px;
    border:1px solid var(--line);
  }

  .empty{
    color:var(--ink-dim);
    padding:40px 0;
    border-top:1px solid var(--line);
    border-bottom:1px solid var(--line);
    font-size:.95rem;
  }

  footer{
    margin-top:80px;
    color:var(--ink-dim);
    font-size:.8rem;
  }
</style>
</head>
<body>
  <div class="wrap">
    <header id="profile-header">
      <!-- يُعبأ تلقائياً -->
    </header>

    <div class="section-label">المشاريع</div>
    <div class="count" id="project-count"></div>
    <div id="projects"></div>

    <footer>يُحدَّث هذا الموقع تلقائياً من لوحة التحكم الخاصة به.</footer>
  </div>

<script>
async function loadData(){
  try{
    const res = await fetch('data.json?_=' + Date.now());
    const data = await res.json();
    renderProfile(data.profile);
    renderProjects(data.projects || []);
  }catch(e){
    document.getElementById('projects').innerHTML =
      '<div class="empty">تعذّر تحميل البيانات. تأكد من وجود ملف data.json بجانب هذه الصفحة.</div>';
  }
}

function renderProfile(p){
  if(!p) return;
  const header = document.getElementById('profile-header');
  let html = '';
  if(p.avatar) html += `<img class="avatar" src="${escapeAttr(p.avatar)}" alt="">`;
  html += `<h1>${escapeHtml(p.name || 'اسمك هنا')}</h1>`;
  if(p.title) html += `<div class="role">${escapeHtml(p.title)}</div>`;
  if(p.bio) html += `<p class="bio">${escapeHtml(p.bio)}</p>`;

  const links = [];
  if(p.github) links.push(`<a href="${escapeAttr(p.github)}" target="_blank" rel="noopener">GitHub</a>`);
  if(p.linkedin) links.push(`<a href="${escapeAttr(p.linkedin)}" target="_blank" rel="noopener">LinkedIn</a>`);
  if(p.email) links.push(`<a href="mailto:${escapeAttr(p.email)}">راسلني</a>`);
  if(links.length) html += `<div class="links">${links.join('')}</div>`;

  header.innerHTML = html;
}

function renderProjects(list){
  const container = document.getElementById('projects');
  const count = document.getElementById('project-count');
  count.textContent = list.length ? `${list.length} مشروع` : '';

  if(!list.length){
    container.innerHTML = '<div class="empty">لا توجد مشاريع مضافة بعد.</div>';
    return;
  }

  container.innerHTML = list.map(pr => `
    <div class="project">
      <h3 class="project-title">
        ${pr.link ? `<a href="${escapeAttr(pr.link)}" target="_blank" rel="noopener">${escapeHtml(pr.title)}</a>` : escapeHtml(pr.title)}
      </h3>
      ${pr.image ? `<img class="project-img" src="${escapeAttr(pr.image)}" alt="">` : ''}
      ${pr.description ? `<p class="project-desc">${escapeHtml(pr.description)}</p>` : ''}
      ${pr.link ? `<div class="project-meta"><a class="project-link" href="${escapeAttr(pr.link)}" target="_blank" rel="noopener">فتح الرابط ←</a></div>` : ''}
    </div>
  `).join('');
}

function escapeHtml(str){
  return String(str || '').replace(/[&<>"']/g, m => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[m]));
}
function escapeAttr(str){ return escapeHtml(str); }

loadData();
</script>
</body>
</html>
